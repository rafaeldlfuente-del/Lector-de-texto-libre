<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#115e59" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#tealGrad)" />

  <!-- Center Card / Book / Speaker Icon inside 80% safe zone (x: 51 to 461, y: 51 to 461) -->
  <g filter="url(#shadow)" transform="translate(96, 96)">
    <!-- Main reader container (320x320) -->
    <rect x="0" y="0" width="320" height="320" rx="44" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="6" stroke-opacity="0.3" />
    
    <!-- Text Lines -->
    <rect x="48" y="70" width="130" height="18" rx="9" fill="#ffffff" />
    <rect x="48" y="112" width="224" height="16" rx="8" fill="#5eead4" />
    <rect x="48" y="148" width="180" height="16" rx="8" fill="#ffffff" fill-opacity="0.8" />
    <rect x="48" y="184" width="200" height="16" rx="8" fill="#ffffff" fill-opacity="0.6" />

    <!-- Speaker / Sound wave indicator at bottom right -->
    <g transform="translate(196, 204)">
      <!-- Speaker Cone -->
      <polygon points="12,32 30,32 46,46 46,18 30,32" fill="#5eead4" />
      <rect x="6" y="27" width="10" height="10" rx="2" fill="#5eead4" />
      <!-- Sound waves -->
      <path d="M54,23 C59,27 59,37 54,41" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" />
      <path d="M62,17 C70,23 70,41 62,47" stroke="#5eead4" stroke-width="4" stroke-linecap="round" fill="none" />
    </g>

    <!-- Play triangle badge -->
    <circle cx="90" cy="240" r="28" fill="#0d9488" />
    <polygon points="84,228 102,240 84,252" fill="#ffffff" />
  </g>
</svg>
